version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # One PR per week for the dev toolchain instead of one per package.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Node types follow the Node version the workflows build with (22), not the latest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
