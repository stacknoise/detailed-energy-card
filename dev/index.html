<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Detailed Energy Card – dev preview</title>
    <style>
      /* HA-like dark theme variables */
      :root {
        --primary-color: #03a9f4;
        --accent-color: #ff9800;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --disabled-text-color: #6f6f6f;
        --divider-color: rgba(225, 225, 225, 0.16);
        --card-background-color: #1c1c1c;
        --primary-background-color: #111111;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #111111;
        color: var(--primary-text-color);
        font-family: Roboto, system-ui, sans-serif;
        max-width: 480px;
      }
      /* ?editor=<scenario>: the card editor in a dialog like the one of Home Assistant, next to the live card */
      body.editor {
        max-width: none;
        padding: 0;
        --primary-color: #8c96e0;
        --text-primary-color: #14142b;
        --divider-color: #3f424d;
        --secondary-text-color: #b0b0b0;
        --warning-color: #ffb74d;
      }
      .dlg {
        background: #1c1c1c;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        height: 1080px;
        width: 1000px;
      }
      .dlg-head {
        align-items: center;
        display: flex;
        font-size: 20px;
        gap: 22px;
        height: 64px;
        padding: 0 18px;
      }
      .dlg-tabs {
        display: flex;
        font-size: 14px;
        font-weight: 500;
        padding: 0 0 0 0;
        width: 480px;
      }
      .dlg-tabs span {
        border-bottom: 1px solid #3f424d;
        color: #e1e1e1;
        flex: 1;
        padding: 14px 0;
        text-align: center;
      }
      .dlg-tabs span.on {
        border-bottom: 2px solid #8c96e0;
        color: #8c96e0;
      }
      .dlg-body {
        display: flex;
        flex: 1;
        gap: 20px;
        min-height: 0;
        padding-top: 6px;
      }
      .pane-l {
        box-sizing: border-box;
        overflow-y: auto;
        padding-right: 8px;
        width: 480px;
      }
      .pane-r {
        background: #141414;
        border-radius: 12px 12px 0 0;
        flex: 1;
        padding: 16px 18px 0 18px;
      }
      .dlg-foot {
        align-items: center;
        color: #8c96e0;
        display: flex;
        font-size: 14px;
        font-weight: 500;
        height: 76px;
        justify-content: space-between;
        padding: 0 22px 0 20px;
      }
      .dlg-foot .btns {
        align-items: center;
        display: flex;
        gap: 30px;
      }
      .dlg-foot .save {
        background: #3f4a8a;
        border-radius: 20px;
        color: #e8eaff;
        padding: 12px 24px;
      }
      /* like the card of Home Assistant around a transparent card: background, border and rounded corners */
      detailed-energy-card {
        background: var(--card-background-color);
        border: 1px solid var(--divider-color);
        border-radius: 12px;
        display: block;
        overflow: hidden;
      }
      ha-card {
        display: block;
        border-radius: 12px;
        border: 1px solid var(--divider-color);
      }
    </style>
  </head>
  <body>
    <detailed-energy-card id="c"></detailed-energy-card>
    <script type="module">
      import * as mdi from "@mdi/js";
      import "../src/detailed-energy-card.ts";

      // Minimal stand-in for Home Assistant's <ha-icon>, drawing MDI icons.
      customElements.define(
        "ha-icon",
        class extends HTMLElement {
          static observedAttributes = ["icon"];
          attributeChangedCallback() {
            this.render();
          }
          connectedCallback() {
            this.render();
          }
          render() {
            const name = (this.getAttribute("icon") ?? "").replace(/^mdi:/, "");
            const key = "mdi" + name.replace(/(^|-)(\w)/g, (_, __, c) => c.toUpperCase());
            const d = mdi[key];
            this.style.display = "inline-flex";
            this.innerHTML = d
              ? `<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);fill:currentColor"><path d="${d}"/></svg>`
              : "";
          }
        },
      );

      // ?lang=en: the demo data (names of floors, rooms, consumers, titles) is English too, for the screenshots of the README
      const LANG = new URLSearchParams(location.search).get("lang") ?? "de";
      const T = (de, en) => (LANG === "en" ? en : de);

      const s = (v, unit = "W") => ({ state: String(v), attributes: { unit_of_measurement: unit, device_class: "power" } });
      const room = (area_id, consumers = []) => ({ area_id, consumers });
      const c = (entity, name) => ({ entity, name });

      const registries = {
        floors: [
          { floor_id: "eg", name: T("EG", "Ground") },
          { floor_id: "og", name: T("OG", "Upper") },
          { floor_id: "keller", name: T("Keller", "Basement") },
        ],
        areas: [
          { area_id: "kueche", name: T("Küche", "Kitchen"), icon: "mdi:stove", floor_id: "eg" },
          { area_id: "wohnzimmer", name: T("Wohnzimmer", "Living room"), icon: "mdi:sofa", floor_id: "eg" },
          { area_id: "flur", name: T("Flur", "Hall"), icon: "mdi:door", floor_id: "eg" },
          { area_id: "bad", name: T("Bad", "Bathroom"), icon: "mdi:shower", floor_id: "og" },
          { area_id: "schlafen", name: T("Schlafen", "Bedroom"), icon: "mdi:bed", floor_id: "og" },
          { area_id: "werkstatt", name: T("Werkstatt", "Workshop"), icon: "mdi:tools", floor_id: "keller" },
          { area_id: "wohnen", name: T("Wohnen", "Living area"), icon: "mdi:sofa" },
          { area_id: "buero", name: T("Büro", "Office"), icon: "mdi:desk" },
          ...[T("Flur 2", "Hall 2"), "Garage", T("Keller", "Cellar"), T("Garten", "Garden"), T("Terrasse", "Terrace"), T("Waschküche", "Laundry room")].map((name, i) => ({
            area_id: `x${i}`,
            name,
            icon: "mdi:home",
          })),
        ],
      };

      const states = {
        "sensor.sehr_lange_entitaet_id_der_kuechen_spuelmaschine_leistung_gesamt": s(1234),
        "sensor.pv": s(3420),
        "sensor.akku": s(480),
        "sensor.soc": { state: "76", attributes: { unit_of_measurement: "%", device_class: "battery" } },
        "sensor.netz": s(350),
        "sensor.total": s(4250),
        "sensor.backofen": s(820),
        "sensor.spuel": s(310),
        "sensor.kuehl": s(120),
        "sensor.kaffee": s(0), // idle consumer
        "sensor.wz": s(540),
        "sensor.flur": s(0), // idle room
        "sensor.og": s(1050),
        "sensor.keller": s(1100),
        // own meters (scenario "meters"): the distribution board of EG and the kitchen
        "sensor.uv_eg": s(2050),
        "sensor.kueche_zaehler": s(1400),
        // flat apartment
        "sensor.balkon": s(620),
        "sensor.netz2": s(1240),
        "sensor.total2": s(1860),
        "sensor.herd": s(710),
        "sensor.spuel2": s(120),
        "sensor.kuehl2": s(110),
        "sensor.wohnen": s(380),
        "sensor.bad": s(280),
        "sensor.buero": s(160),
        "sensor.schlafen": s(100),
        ...Object.fromEntries(Array.from({ length: 10 }, (_, i) => [`sensor.r${i}`, s(100 + i * 60)])),
        ...Object.fromEntries(Array.from({ length: 10 }, (_, i) => [`sensor.r${i}b`, s(20 + i * 15)])),
        ...Object.fromEntries(Array.from({ length: 10 }, (_, i) => [`sensor.r${i}c`, s(i % 3 === 0 ? 0 : 8 + i * 4)])),
      };

      const thresholds = [
        { from: 0, color: "#4caf50" },
        { from: 500, color: "#ff9800" },
        { from: 2000, color: "#f44336" },
      ];

      const sources = [
        { entity: "sensor.pv", type: "solar" },
        { entity: "sensor.akku", type: "battery", soc_entity: "sensor.soc" },
        { entity: "sensor.netz", type: "grid" },
      ];

      const manyRooms = Array.from({ length: 10 }, (_, i) => room(i < 8 ? registries.areas[i].area_id : `x${i - 8}`, [c(`sensor.r${i}`, `${T("Verbraucher", "Consumer")} ${i + 1}`), c(`sensor.r${i}b`, `Standby ${i + 1}`), c(`sensor.r${i}c`, `${T("Beleuchtung", "Lighting")} ${i + 1}`)]));

      const scenarios = {
        floors: {
          title: T("Energiefluss", "Energy"),
          home: { total_entity: "sensor.total" },
          sources,
          colors: { thresholds },
          options: { unit: "kW" },
          floors: [
            {
              floor_id: "eg",
              rooms: [
                room("kueche", [
                  c("sensor.backofen", T("Backofen", "Oven")),
                  c("sensor.spuel", T("Spülmaschine", "Dishwasher")),
                  c("sensor.kuehl", T("Kühlschrank", "Fridge")),
                  c("sensor.kaffee", T("Kaffeemaschine", "Coffee machine")),
                ]),
                room("wohnzimmer", [c("sensor.wz", "TV & Sound")]),
                room("flur", [c("sensor.flur", T("Beleuchtung", "Lighting"))]),
              ],
            },
            { floor_id: "og", rooms: [room("bad", [c("sensor.og", T("Fußbodenheizung", "Underfloor heating"))])] },
            { floor_id: "keller", rooms: [room("werkstatt", [c("sensor.keller", T("Werkzeug", "Tools"))])] },
          ],
        },
        flat: {
          title: "Energiefluss",
          home: { total_entity: "sensor.total2" },
          sources: [
            { entity: "sensor.balkon", type: "solar", name: "Balkon-PV" },
            { entity: "sensor.netz2", type: "grid" },
          ],
          colors: { thresholds },
          options: { unit: "kW" },
          rooms: [
            room("kueche", [c("sensor.herd", T("Herd", "Cooker")), c("sensor.spuel2", T("Spülmaschine", "Dishwasher")), c("sensor.kuehl2", T("Kühlschrank", "Fridge"))]),
            room("wohnen", [c("sensor.wohnen", T("Wohnzimmer", "Living room"))]),
            room("bad", [c("sensor.bad", T("Bad", "Bathroom"))]),
            room("buero", [c("sensor.buero", T("Büro", "Office"))]),
            room("schlafen", [c("sensor.schlafen", T("Schlafen", "Bedroom"))]),
          ],
        },
        long: {
          title: "Lange Namen",
          sources,
          rooms: [
            room("kueche", [
              c("sensor.sehr_lange_entitaet_id_der_kuechen_spuelmaschine_leistung_gesamt"),
              c("sensor.backofen", T("Backofen mit einem außergewöhnlich langen Anzeigenamen", "Oven with an exceptionally long display name")),
              c("sensor.kuehl", T("Kühlschrank", "Fridge")),
            ]),
          ],
        },
        many: { title: T("Viele Räume", "Many rooms"), sources, options: { unit: "kW" }, rooms: manyRooms },
        wrap: { title: "Viele Räume", sources, options: { unit: "kW", wrap_rooms: true }, rooms: manyRooms },
        duplicate: {
          title: "Doppelt",
          rooms: [room("kueche", [c("sensor.backofen")]), room("bad", [c("sensor.backofen")])],
        },
        invalid: { title: "Ungültig", rooms: [{ name: "ohne area_id" }] },
      };

      // Own limits per level, and the oven with its own list (green until 1 kW instead of orange from 300 W).
      scenarios.thresholds = {
        ...scenarios.floors,
        colors: {
          thresholds,
          level_thresholds: {
            source: [
              { from: 0, color: "#4caf50", width: 2 },
              { from: 2000, color: "#ff9800", width: 4 },
              { from: 6000, color: "#f44336", width: 6 },
            ],
            floor: [
              { from: 0, color: "#4caf50", width: 2 },
              { from: 1500, color: "#ff9800", width: 3.5 },
              { from: 4000, color: "#f44336", width: 5.5 },
            ],
            room: [
              { from: 0, color: "#4caf50", width: 1.5 },
              { from: 800, color: "#ff9800", width: 3 },
              { from: 2500, color: "#f44336", width: 5 },
            ],
            consumer: [
              { from: 0, color: "#4caf50" },
              { from: 300, color: "#ff9800" },
              { from: 1500, color: "#f44336" },
            ],
          },
        },
        floors: scenarios.floors.floors.map((f, i) =>
          i === 0
            ? {
                ...f,
                rooms: f.rooms.map((r, j) =>
                  j === 0
                    ? {
                        ...r,
                        consumers: r.consumers.map((cn) =>
                          cn.entity === "sensor.backofen"
                            ? { ...cn, thresholds: [{ from: 0, color: "#4caf50" }, { from: 1000, color: "#f44336" }] }
                            : cn,
                        ),
                      }
                    : r,
                ),
              }
            : f,
        ),
      };

      // The selected floor or room slides to the middle, the others fade out (options.focus_selected).
      scenarios.focus = { ...scenarios.floors, options: { unit: "kW", focus_selected: true } };

      // Energy mode: the same house with energy counters. The coffee machine has no energy sensor on purpose.
      const energyId = (id) => "sensor.e_" + id.slice("sensor.".length);
      const withEnergy = (rooms) =>
        rooms.map((r) => ({
          ...r,
          consumers: r.consumers.map((cn) => (cn.entity === "sensor.kaffee" ? cn : { ...cn, energy_entity: energyId(cn.entity) })),
        }));
      scenarios.energy = {
        ...scenarios.floors,
        home: { ...scenarios.floors.home, total_energy_entity: "sensor.e_total" },
        sources: scenarios.floors.sources.map((src) => ({ ...src, energy_entity: energyId(src.entity) })),
        floors: scenarios.floors.floors.map((f) => ({ ...f, rooms: withEnergy(f.rooms) })),
        options: { unit: "kW", mode: "energy" },
      };
      // Feed-in and charging in the energy mode: the grid and the battery count both directions.
      scenarios.feedin = {
        ...scenarios.energy,
        sources: scenarios.energy.sources.map((src) =>
          src.type === "grid"
            ? { ...src, energy_entity_return: "sensor.e_netz_einspeisung" }
            : src.type === "battery"
              ? { ...src, energy_entity_return: "sensor.e_akku_geladen" }
              : src,
        ),
      };
      // Costs (package P8): a dynamic price, a fixed feed-in compensation, the costs as second value.
      const prices = { "sensor.strompreis": true };
      const costToday = { "sensor.e_netz_cost": 1.62, "sensor.e_netz_einspeisung_compensation": 0.3 };
      states["sensor.strompreis"] = { state: "0.31", attributes: { unit_of_measurement: "EUR/kWh", state_class: "measurement", friendly_name: "Strompreis" } };
      scenarios.costs = {
        ...scenarios.feedin,
        options: { unit: "kW", mode: "energy", price_entity: "sensor.strompreis", feed_in_price: 0.08, currency: "EUR", secondary_value: "cost" },
      };
      // Timeline (like mock B3): the energy of the day per hour, stacked by floor, yesterday dashed.
      scenarios.timeline = { ...scenarios.energy, options: { unit: "kW", mode: "energy", view: "timeline", views: ["tree", "timeline"] } };
      // Actions and switches (package P15): the sun navigates and, held, opens the battery; a double tap on OG runs a
      // script; two consumers have a switch, the heating asks before it is turned off.
      scenarios.actions = {
        ...scenarios.floors,
        sources: scenarios.floors.sources.map((src) =>
          src.type === "solar"
            ? { ...src, tap_action: { action: "navigate", navigation_path: "/dev-target" }, hold_action: { action: "more-info", entity: "sensor.soc" } }
            : src,
        ),
        floors: scenarios.floors.floors.map((f) => ({
          ...f,
          ...(f.floor_id === "og" ? { double_tap_action: { action: "perform-action", perform_action: "script.turn_on", target: { entity_id: "script.demo" } } } : {}),
          rooms: f.rooms.map((r) => ({
            ...r,
            consumers: r.consumers.map((cn) =>
              cn.entity === "sensor.kaffee"
                ? { ...cn, switch_entity: "switch.kaffee" }
                : cn.entity === "sensor.og"
                  ? { ...cn, switch_entity: "switch.heizung", confirm_switch: true }
                  : cn,
            ),
          })),
        })),
      };
      // Compact view (package P16): sources, home and floors in small circles, no list, no view switch.
      scenarios.compact = { ...scenarios.energy, options: { unit: "kW", mode: "power", compact: true, views: ["tree", "sankey", "timeline"] } };
      // Sankey diagram (like mock B1): sources, floors, rooms; click a floor for its rooms, a room for its consumers.
      scenarios.sankey = { ...scenarios.feedin, options: { unit: "kW", mode: "energy", view: "sankey", views: ["tree", "sankey", "timeline"] } };
      // Base load and standby (package P11): the badge in the head, the fridge runs all the time.
      scenarios.standby = { ...scenarios.floors, options: { unit: "W", show_base_load: true, standby_watts: 5 } };
      // Second value (like mock A1): the power now with the energy of today below; in the energy mode the other way round.
      scenarios.secondary = { ...scenarios.energy, options: { unit: "kW", mode: "power", secondary_value: "auto" } };
      // Own meters of floors and rooms (like mock A2): EG in its distribution board, the kitchen with a
      // power and an energy meter, the hall with an energy meter only; the other rooms show their sum.
      scenarios.meters = {
        ...scenarios.energy,
        floors: scenarios.energy.floors.map((f) =>
          f.floor_id !== "eg"
            ? f
            : {
                ...f,
                entity: "sensor.uv_eg",
                energy_entity: "sensor.e_uv_eg",
                rooms: f.rooms.map((r) =>
                  r.area_id === "kueche"
                    ? { ...r, entity: "sensor.kueche_zaehler", energy_entity: "sensor.e_kueche_zaehler" }
                    : r.area_id === "flur"
                      ? { ...r, energy_entity: "sensor.e_flur_zaehler" }
                      : r,
                ),
              },
        ),
      };
      // share of the energy of a day per hour: low at night, peaks in the morning, at noon and in the evening
      const profile = (h) =>
        0.35 + Math.exp(-((h - 7) ** 2) / 2) * 0.9 + Math.exp(-((h - 12.5) ** 2) / 1.5) * 2.2 + Math.exp(-((h - 18.5) ** 2) / 3) * 1.6;
      // kWh of "today"; longer periods are a multiple of it
      const energyToday = {
        "sensor.e_nur_zaehler": 1.2,
        "sensor.e_pv": 12.4, "sensor.e_akku": 2.0, "sensor.e_netz": 5.1, "sensor.e_total": 19.5,
        "sensor.e_backofen": 4.2, "sensor.e_spuel": 2.6, "sensor.e_kuehl": 1.9, "sensor.e_wz": 3.1,
        "sensor.e_flur": 0, "sensor.e_og": 4.9, "sensor.e_keller": 2.1,
        "sensor.e_uv_eg": 12.6, "sensor.e_kueche_zaehler": 9.1, "sensor.e_flur_zaehler": 0.4,
        // the other direction (scenario "feedin"): fed into the grid, charged into the battery
        "sensor.e_netz_einspeisung": 3.8, "sensor.e_akku_geladen": 2.4,
      };

      // names for the entity pickers of the editor view, and the energy counters
      const friendly = {
        "sensor.pv": T("PV Leistung", "PV power"),
        "sensor.akku": T("Akku Leistung", "Battery power"),
        "sensor.netz": T("Netz Leistung", "Grid power"),
        "sensor.total": T("Haus Leistung", "Home power"),
        "sensor.backofen": T("Backofen Leistung", "Oven power"),
        "sensor.spuel": T("Spülmaschine Leistung", "Dishwasher power"),
        "sensor.kuehl": T("Kühlschrank Leistung", "Fridge power"),
        "sensor.kaffee": T("Kaffeemaschine Leistung", "Coffee machine power"),
        "sensor.wz": T("TV und Sound Leistung", "TV and sound power"),
        "sensor.flur": T("Beleuchtung Flur Leistung", "Hall lighting power"),
        "sensor.og": T("Fußbodenheizung Leistung", "Underfloor heating power"),
        "sensor.keller": T("Werkzeug Leistung", "Tools power"),
      };
      for (const [id, name] of Object.entries(friendly)) states[id].attributes.friendly_name = name;
      for (const [id, kwh] of Object.entries(energyToday)) {
        const base = friendly["sensor." + id.slice("sensor.e_".length)];
        states[id] = {
          state: String(kwh),
          attributes: { unit_of_measurement: "kWh", device_class: "energy", state_class: "total_increasing", friendly_name: base ? base.replace(T("Leistung", "power"), T("Energie", "energy")) : id },
        };
      }

      // The editor view: a card for the scenario "editor" (energy sensors, thresholds, focus) in its editor.
      scenarios.editor = {
        ...scenarios.energy,
        sources: scenarios.energy.sources.map((src, i) => ({ ...src, name: [T("PV", "PV"), T("Akku", "Battery"), T("Netz", "Grid")][i] })),
        colors: { ...scenarios.thresholds.colors, preset: "custom", accent: "#9184d9", flow: "#b5abfc", bar: "#b5abfc" },
        options: { unit: "kW", decimals: 2, focus_selected: true, mode: "power", energy_periods: ["today", "week", "month"] },
      };

      const params = new URLSearchParams(location.search);
      // ?width=900 lets the card grow wider than the default 480px preview column
      if (params.get("width")) document.body.style.maxWidth = params.get("width") + "px";
      const name = params.get("scenario") ?? "floors";
      let el = document.getElementById("c");
      // ?card=heatmap: the heatmap card (package P12) instead of the energy card
      const heatmap = params.get("card") === "heatmap";
      if (heatmap) {
        const h = document.createElement("detailed-energy-heatmap-card");
        h.id = "c";
        el.replaceWith(h);
        el = h;
        el.setConfig({
          type: "custom:detailed-energy-heatmap-card",
          entity: "sensor.e_total",
          days: Number(params.get("days") ?? 14),
          title: T("Wann wird Strom verbraucht?", "When is electricity used?"),
          price_entity: params.get("price") === "0" ? undefined : "sensor.strompreis",
        });
      } else {
        el.setConfig({ type: "custom:detailed-energy-card", ...scenarios[name] });
      }
      // What the wizard "import from the Energy dashboard" reads: the registries as objects, the devices of the
      // consumers and the answer of energy/get_prefs (?prefs=empty: the dashboard was never set up, ?prefs=error)
      const byId = (list, key) => Object.fromEntries(list.map((x) => [x[key], x]));
      const consumerArea = { backofen: "kueche", spuel: "kueche", kuehl: "kueche", wz: "wohnzimmer", flur: "flur", og: "bad", keller: "werkstatt" };
      const registryEntities = {};
      for (const [id, area] of Object.entries(consumerArea)) {
        registryEntities[`sensor.e_${id}`] = { device_id: `d_${id}` };
        registryEntities[`sensor.${id}`] = { device_id: `d_${id}` };
      }
      for (const id of ["pv", "netz", "akku"]) {
        registryEntities[`sensor.e_${id}`] = { device_id: `d_${id}` };
        registryEntities[`sensor.${id}`] = { device_id: `d_${id}` };
      }
      const registryDevices = Object.fromEntries(Object.entries(consumerArea).map(([id, area]) => [`d_${id}`, { area_id: area }]));
      const energyPrefs = {
        energy_sources: [
          { type: "grid", stat_energy_from: "sensor.e_netz", stat_energy_to: "sensor.e_netz_einspeisung", stat_rate: "sensor.netz", cost_adjustment_day: 0 },
          { type: "solar", stat_energy_from: "sensor.e_pv" },
          { type: "battery", stat_energy_from: "sensor.e_akku", stat_energy_to: "sensor.e_akku_geladen", stat_soc: "sensor.soc" },
        ],
        device_consumption: [
          { stat_consumption: "sensor.e_backofen", name: T("Backofen", "Oven") },
          { stat_consumption: "sensor.e_spuel" },
          { stat_consumption: "sensor.e_kuehl" },
          { stat_consumption: "sensor.e_wz" },
          { stat_consumption: "sensor.e_flur" },
          { stat_consumption: "sensor.e_og" },
          { stat_consumption: "sensor.e_keller" },
          { stat_consumption: "sensor.e_nur_zaehler" },
          { stat_consumption: "tibber:consumption_home" },
        ],
      };
      // services the page records in window.__calls; a switch changes its state, so that the card shows it
      window.__calls = [];
      states["switch.kaffee"] = { state: "off", attributes: { friendly_name: T("Kaffeemaschine", "Coffee machine") } };
      states["switch.heizung"] = { state: "on", attributes: { friendly_name: "Heizung" } };
      const hass = {
        callService: async (domain, service, data, target) => {
          window.__calls.push({ domain, service, data, target });
          const id = data?.entity_id;
          const cur = window.__hass ?? hass;
          if (domain === "homeassistant" && cur.states[id]) {
            const on = service === "turn_on" || (service === "toggle" && cur.states[id].state === "off");
            // a new hass with a new states object, like Home Assistant sends one: the card compares the entries
            window.__hass = { ...cur, states: { ...cur.states, [id]: { ...cur.states[id], state: on ? "on" : "off" } } };
            el.hass = window.__hass;
          }
        },
        language: params.get("lang") ?? "de", // ?lang=en previews the English texts
        config: { location_name: T("Zuhause", "Home") },
        states,
        areas: byId(registries.areas, "area_id"),
        floors: byId(registries.floors.map((f, i) => ({ ...f, level: i })), "floor_id"),
        entities: registryEntities,
        devices: registryDevices,
        callWS: async (m) => {
          if (m.type === "energy/get_prefs") {
            if (params.get("prefs") === "empty") throw { code: "not_found", message: "No prefs." };
            if (params.get("prefs") === "error") throw new Error("boom");
            return energyPrefs;
          }
          if (m.type === "recorder/statistics_during_period") {
            if (params.get("energyError")) throw new Error("no statistics");
            const start = Date.parse(m.start_time);
            const end = Date.parse(m.end_time);
            const days = (end - start) / 86400000;
            // one day (also in hours) is the value of today; longer periods a multiple of it, in hours or in days
            const factor = days <= 1.01 ? 1 : Math.min(30, Math.max(2, Math.round(days)));
            // price sensors: the hourly mean, higher in the morning and in the evening
            if (m.types.includes("mean")) {
              const rows = [];
              for (let t = start; t + 3600000 <= end; t += 3600000) {
                const h = new Date(t).getHours();
                rows.push({ start: t, mean: 0.24 + 0.08 * Math.exp(-((h - 7.5) ** 2) / 3) + 0.12 * Math.exp(-((h - 19) ** 2) / 4) });
              }
              // power sensors (base load, standby): hourly means; the home needs about 185 W at night, the fridge runs all the time
              const power = (id) => {
                const base = Number(states[id]?.state) || 0;
                const out = [];
                for (let t = start; t + 3600000 <= end; t += 3600000) {
                  const h = new Date(t).getHours();
                  const night = h >= 1 && h < 5;
                  out.push({ start: t, mean: id === "sensor.kuehl" ? 14 + 2 * Math.sin(t) : id === "sensor.total" ? (night ? 185 : 185 + 900 * profile(h)) : night ? 0 : base * profile(h) * 0.5 });
                }
                return out;
              };
              return Object.fromEntries(m.statistic_ids.filter((id) => id in prices || id in states).map((id) => [id, id in prices ? rows : power(id)]));
            }
            // the cost statistics of the Energy dashboard (only when a test adds their state)
            if (m.statistic_ids.some((id) => id in costToday)) {
              return Object.fromEntries(
                m.statistic_ids.filter((id) => id in costToday).map((id) => [id, [{ start, change: costToday[id] * factor }]]),
              );
            }
            // an earlier period (it ended before now) used a little less, so that the comparison has something to show;
            // "today" packs the whole value into the hours so far, so a whole earlier day is scaled up to match
            const earlier = end < Date.now() - 60000;
            const hoursToday = new Date(Date.now()).getHours();
            const sum = (n) => Array.from({ length: n }, (_, h) => profile(h)).reduce((a, b) => a + b, 0);
            const scale = !earlier ? 1 : m.period === "hour" && hoursToday > 0 ? (0.88 * sum(24)) / sum(hoursToday) : 0.88;
            // rows like Home Assistant sends them: full hours with a daily profile, or days
            const H = 3600000;
            const slots = [];
            if (m.period === "hour") {
              for (let t = start; t + H <= end; t += H) {
                const day = new Date(t);
                // the heatmap card: every day a little different, and a gap now and then
                if (params.get("card") === "heatmap") {
                  if (day.getDate() % 5 === 0 && day.getHours() === 3) continue;
                  slots.push([t, profile(day.getHours()) * (0.75 + 0.5 * Math.abs(Math.sin(day.getDate() * 1.7)))]);
                } else slots.push([t, profile(day.getHours())]);
              }
              if (!slots.length) slots.push([start, 1]);
            } else {
              for (let t = start; t < end; t += 86400000) slots.push([t, Math.min(1, (end - t) / 86400000) * (1 + 0.15 * Math.sin(t / 86400000))]);
            }
            const weight = slots.reduce((s, [, w]) => s + w, 0) || 1;
            return Object.fromEntries(
              m.statistic_ids
                .filter((id) => id in energyToday)
                .map((id) => [id, slots.map(([t, w]) => ({ start: t, change: (energyToday[id] * factor * scale * w) / weight }))]),
            );
          }
          return m.type.includes("floor") ? registries.floors : registries.areas;
        },
      };
      el.hass = hass;

      const editorScenario = params.get("editor");
      if (editorScenario) {
        await import("./ha-form-stub.js");
        document.body.classList.add("editor");
        const dlg = document.createElement("div");
        dlg.className = "dlg";
        dlg.innerHTML = `
          <div class="dlg-head"><span>✕</span><span>${T("Energy-Karte anpassen", "Customize the energy card")}</span></div>
          <div class="dlg-tabs"><span class="on">${T("Konfiguration", "Configuration")}</span><span>${T("Sichtbarkeit", "Visibility")}</span><span>Layout</span></div>
          <div class="dlg-body"><div class="pane-l"></div><div class="pane-r"></div></div>
          <div class="dlg-foot"><span>${T("Code-Editor anzeigen", "Show code editor")}</span><span class="btns"><span>${T("Abbrechen", "Cancel")}</span><span class="save">${T("Speichern", "Save")}</span></span></div>`;
        document.body.appendChild(dlg);
        dlg.querySelector(".pane-r").appendChild(el);
        const config = { type: "custom:detailed-energy-card", ...scenarios[editorScenario] };
        el.setConfig(config);
        const editor = document.createElement("detailed-energy-card-editor");
        dlg.querySelector(".pane-l").appendChild(editor);
        editor.hass = hass;
        editor.setConfig(config);
        editor.addEventListener("config-changed", (e) => el.setConfig(e.detail.config));
      }
    </script>
  </body>
</html>
